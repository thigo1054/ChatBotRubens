<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dra. Lex | Tire suas Dúvidas Jurídicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- Barra superior compacta -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">⚖️</div>
        <div class="brand-text">
          <h1>Dra. Lex</h1>
          <p class="status"><span class="dot"></span> Tira-dúvidas jurídico gratuito</p>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="font-btn" class="action-btn" title="Aumentar ou diminuir o tamanho da letra" aria-label="Alterar tamanho da letra">
          <span class="action-icon">🔠</span>
          <span class="action-label" id="font-label">Letra maior</span>
        </button>

        <button type="button" id="theme-btn" class="action-btn" title="Alternar entre modo claro e escuro" aria-label="Alternar tema claro ou escuro">
          <span class="action-icon" id="theme-icon">🌙</span>
          <span class="action-label" id="theme-label">Modo escuro</span>
        </button>

        <button type="button" id="reset" class="action-btn action-reset" title="Apagar conversa e começar de novo" aria-label="Nova conversa">
          <span class="action-icon">🔄</span>
          <span class="action-label">Nova conversa</span>
        </button>
      </div>
    </header>

    <!-- Área principal do chat -->
    <main class="chat-area" id="messages" aria-live="polite">
      <!-- Mensagem inicial curta + Aba recolhível de dúvidas rápidas -->
      <section class="welcome" id="welcome">
        <div class="msg bot">
          <div class="msg-avatar" aria-hidden="true">⚖️</div>
          <div class="bubble">
            Olá! 👋 Sou a <strong>Dra. Lex</strong>. Explico seus direitos de forma simples e rápida. Escreva sua pergunta abaixo ou abra a aba de <strong>dúvidas comuns</strong>:
          </div>
        </div>

        <div class="topics-drawer" id="topics-drawer">
          <button type="button" class="topics-toggle" id="topics-toggle" aria-expanded="false">
            <span>💡 Ver exemplos de dúvidas comuns</span>
            <span class="chevron" id="topics-chevron" aria-hidden="true">▾</span>
          </button>

          <div class="topics" id="suggestions" role="group" aria-label="Exemplos de perguntas" hidden>
            <button type="button" class="topic-card" data-question="Comprei um produto com defeito ou me arrependi da compra. Quais são os meus direitos?">
              <span class="topic-emoji">🛒</span>
              <div class="topic-text">
                <strong>Direito do Consumidor</strong>
                <span>Produto com defeito, cobrança indevida ou nome sujo</span>
              </div>
            </button>

            <button type="button" class="topic-card" data-question="Fui demitido sem justa causa. O que eu tenho direito a receber na rescisão?">
              <span class="topic-emoji">👷</span>
              <div class="topic-text">
                <strong>Direitos Trabalhistas</strong>
                <span>Demissão, férias, FGTS, horas extras e carteira</span>
              </div>
            </button>

            <button type="button" class="topic-card" data-question="Como funciona a pensão alimentícia, guarda dos filhos ou divórcio no Brasil?">
              <span class="topic-emoji">👨‍👩‍👧</span>
              <div class="topic-text">
                <strong>Família e Pensão</strong>
                <span>Pensão alimentícia, divórcio, guarda e herança</span>
              </div>
            </button>

            <button type="button" class="topic-card" data-question="Quais são as regras atuais para aposentadoria, auxílio-doença ou BPC/LOAS no INSS?">
              <span class="topic-emoji">🧓</span>
              <div class="topic-text">
                <strong>INSS e Aposentadoria</strong>
                <span>Aposentadoria, auxílio-doença e benefício BPC/LOAS</span>
              </div>
            </button>

            <button type="button" class="topic-card" data-question="Tenho dúvidas sobre contrato de aluguel, despejo ou problemas com vizinhos. Como a lei funciona?">
              <span class="topic-emoji">🏠</span>
              <div class="topic-text">
                <strong>Aluguel e Moradia</strong>
                <span>Contratos de aluguel, imóveis e vizinhança</span>
              </div>
            </button>

            <button type="button" class="topic-card" data-question="Caí em um golpe pela internet ou no Pix. O que devo fazer imediatamente para tentar recuperar meu dinheiro?">
              <span class="topic-emoji">🛡️</span>
              <div class="topic-text">
                <strong>Golpes e Internet</strong>
                <span>Golpe do Pix, compras falsas e boletim de ocorrência</span>
              </div>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Rodapé com caixa de pergunta limpa e sem rolagem no placeholder -->
    <footer class="composer-wrap">
      <form id="form" class="composer">
        <label for="input" class="sr-only">Digite sua dúvida</label>
        <textarea
          id="input"
          rows="1"
          placeholder="Digite sua dúvida..."
          required
        ></textarea>
        <button type="submit" id="send" class="send-btn" aria-label="Enviar pergunta">
          <span class="send-label">Perguntar</span>
          <span class="send-arrow" aria-hidden="true">➤</span>
        </button>
      </form>
      <p class="disclaimer">
        ℹ️ Orientação educativa. Para processos, procure um advogado ou a <strong>Defensoria Pública (129)</strong>.
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
